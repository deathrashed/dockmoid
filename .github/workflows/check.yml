name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development metadata validator
        run: sudo apt-get update && sudo apt-get install -y appstream zip unzip
      - name: Fixtures, transactional installer, release manifest and metadata
        env:
          DOCKMOID_SKIP_QML_LINT: '1'
        run: tests/run.sh
  qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Qt 6 and Plasma development imports
        run: pacman -Syu --noconfirm nodejs python qt6-declarative qt6-tools libplasma kirigami kdeclarative kcmutils appstream git zip unzip
      - uses: actions/checkout@v4
      - name: Full checks with native Qt 6 imports
        run: tests/run.sh
